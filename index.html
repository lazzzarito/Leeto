<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0b0b0b" />
    <meta
      name="description"
      content="Leeto: importa EPUB, PDF, cómics y texto, lee sin conexión y guarda tus citas en este dispositivo."
    />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" type="image/svg+xml" href="/icons/icon.svg" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icons/icon-192.png" />
    <link rel="apple-touch-icon" sizes="192x192" href="/icons/icon-192.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Leeto" />
    <script>
      // Aplica el tema antes del primer pintado para evitar el destello inicial.
      (function () {
        var saved = null;
        var mode = 'system';
        var valid = ['paper', 'amber', 'sepia', 'eink', 'oled'];
        try {
          var raw = localStorage.getItem('leeto.theme');
          if (raw && raw.charAt(0) === '{') {
            var cached = JSON.parse(raw);
            saved = cached.theme;
            mode = cached.mode === 'manual' ? 'manual' : 'system';
          } else if (raw) {
            saved = raw;
            mode = 'manual';
          }
        } catch (e) {
          saved = null;
        }
        var theme =
          mode === 'manual' && valid.indexOf(saved) !== -1
            ? saved
            : window.matchMedia('(prefers-color-scheme: dark)').matches
              ? 'oled'
              : 'paper';
        document.documentElement.dataset.readingTheme = theme;
        document.documentElement.style.colorScheme = theme === 'oled' ? 'dark' : 'light';
      })();
    </script>
    <meta property="og:title" content="Leeto — lector de libros" />
    <meta
      property="og:description"
      content="Importa EPUB, PDF, cómics y texto, lee sin conexión y guarda tus citas en este dispositivo."
    />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <title>Leeto — lector de EPUB, PDF y cómics</title>
  </head>
  <body>
    <script>
      // En desarrollo el build no inyecta metadatos: completamos las URLs
      // canónicas desde el origen real.
      (function () {
        if (document.querySelector('link[rel="canonical"]')) return;
        var base = location.origin + location.pathname.replace(/index\.html$/, '');
        var head = document.head;
        var link = document.createElement('link');
        link.rel = 'canonical';
        link.href = base;
        head.appendChild(link);
        var ogUrl = document.createElement('meta');
        ogUrl.setAttribute('property', 'og:url');
        ogUrl.content = base;
        head.appendChild(ogUrl);
        var ogImage = document.querySelector('meta[property="og:image"]');
        if (ogImage && ogImage.content.charAt(0) === '/') {
          ogImage.content = location.origin + ogImage.content;
        }
      })();
    </script>
    <div id="boot-splash" style="position:fixed;inset:0;z-index:200;display:flex;flex-direction:column;align-items:center;justify-content:center;background:hsl(var(--background));color:hsl(var(--foreground));font-family:system-ui,sans-serif">
      <img src="/icons/icon-192.webp" alt="" width="72" height="72" style="width:72px;height:72px;border-radius:18px">
      <p style="margin:16px 0 0;font-size:1.5rem;letter-spacing:.25em">Leeto</p>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
