  </g>

  <g transform="translate(612 42)" filter="url(#shadow)">
    <rect width="250" height="356" rx="30" fill="url(#card)"/>
    <rect x="22" y="24" width="206" height="5" rx="3" fill="#f59e0b" opacity="0.35"/>
    <rect x="22" y="24" width="132" height="5" rx="3" fill="#fbbf24"/>
    <g fill="#f5f5f4" opacity="0.9">
