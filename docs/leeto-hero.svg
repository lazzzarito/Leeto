    <path d="M20 26c6-4 12-4 18 0 6-4 12-4 18 0v28c-6-4-12-4-18 0-6-4-12-4-18 0zM38 26v28" fill="none" stroke="#fff" stroke-width="3.6" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="100" y="56" font-family="Georgia, serif" font-size="58" font-weight="700" fill="#292524" letter-spacing="-2">Leeto</text>
    <text x="102" y="92" font-family="Segoe UI, Arial, sans-serif" font-size="17" fill="#78716c" letter-spacing="1.5">TUS LIBROS, A TU RITMO</text>
