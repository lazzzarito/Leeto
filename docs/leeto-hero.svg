  <use href="#doodle-star" transform="translate(1010 118) rotate(16) scale(1.25)" filter="url(#soft)"/>
  <use href="#doodle-heart" transform="translate(1092 238) rotate(-12) scale(1.1)" filter="url(#soft)"/>
