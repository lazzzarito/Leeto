    <text x="160" y="30" font-family="Segoe UI, Arial, sans-serif" font-size="15" fill="#78350f">🔒 100 % local</text>
    <text x="292" y="30" font-family="Segoe UI, Arial, sans-serif" font-size="15" fill="#78350f">📴 Offline</text>
  </g>

  <g transform="translate(720 46) rotate(7)" filter="url(#shadow)">
