      <rect x="96" y="58" width="104" height="10" rx="5" opacity="0.75"/>
      <rect x="34" y="150" width="182" height="12" rx="6" opacity="0.55"/>
      <rect x="46" y="174" width="158" height="12" rx="6" opacity="0.55"/>
      <rect x="34" y="198" width="120" height="12" rx="6" opacity="0.35"/>
      <rect x="34" y="234" width="182" height="12" rx="6" opacity="0.55"/>
      <rect x="46" y="258" width="140" height="12" rx="6" opacity="0.55"/>
    </g>
    <rect x="82" y="94" width="86" height="42" rx="10" fill="#f59e0b" opacity="0.25"/>
    <text x="125" y="122" text-anchor="middle" font-family="Georgia, serif" font-size="17" fill="#fcd34d">Capítulo I</text>
    <g transform="translate(0 292)" fill="#fbbf24" opacity="0.85">
      <circle cx="52" cy="0" r="10"/><circle cx="104" cy="0" r="10"/><circle cx="156" cy="0" r="10"/><circle cx="208" cy="0" r="10"/>
    </g>
