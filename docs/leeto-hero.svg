<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-label="Leeto, lee a tu ritmo">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fffaf0"/>
      <stop offset="0.55" stop-color="#fdf1dc"/>
      <stop offset="1" stop-color="#f6dfb8"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.72" cy="0.38" r="0.55">
      <stop offset="0" stop-color="#fbbf24" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#fbbf24" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="card" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1c1917"/>
      <stop offset="1" stop-color="#0c0a09"/>
    </linearGradient>
    <linearGradient id="amber" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fbbf24"/>
      <stop offset="1" stop-color="#d97706"/>
    </linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="180%">
      <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#78350f" flood-opacity="0.22"/>
    </filter>
    <filter id="soft" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#78350f" flood-opacity="0.16"/>
    </filter>
    <g id="doodle-star" fill="none" stroke="#d97706" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
      <path d="M0-13 3-4l12 0-9 6 4 10-10-6-10 6 4-10-9-6h12z"/>
    </g>
    <g id="doodle-heart" fill="none" stroke="#d97706" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
      <path d="M0 10C-7 4-13 0-13-6a7 7 0 0 1 13-2 7 7 0 0 1 13 2C13 0 7 4 0 10z"/>
    </g>
    <g id="doodle-leaf" fill="none" stroke="#d97706" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
      <path d="M0 12C-12 2-9-12 5-14 10-2 7 10 0 12zM0 12c-2-9 0-16 5-21"/>
    </g>
    <g id="doodle-book" fill="none" stroke="#d97706" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
      <path d="M-17-12c6-4 12-4 17 0 5-4 11-4 17 0v24c-6-4-12-4-17 0-5-4-11-4-17 0zM0-12v24"/>
    </g>
  </defs>

  <rect width="1200" height="420" fill="url(#bg)"/>
  <rect width="1200" height="420" fill="url(#glow)"/>
  <circle cx="1040" cy="70" r="150" fill="#fcd34d" opacity="0.18"/>
  <circle cx="170" cy="380" r="120" fill="#f59e0b" opacity="0.08"/>

  <g opacity="0.65">
    <use href="#doodle-star" transform="translate(96 78) rotate(-14) scale(0.9)"/>
    <use href="#doodle-heart" transform="translate(142 330) rotate(12) scale(0.8)"/>
    <use href="#doodle-leaf" transform="translate(338 62) rotate(24) scale(0.75)"/>
    <use href="#doodle-book" transform="translate(396 358) rotate(-10) scale(0.8)"/>
    <use href="#doodle-star" transform="translate(660 44) rotate(18) scale(0.6)"/>
    <use href="#doodle-leaf" transform="translate(1128 350) rotate(-22) scale(0.9)"/>
